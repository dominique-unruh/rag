[project]
name = "rag"
version = "0.1.0"
description = "Local single-user RAG pipeline: extract, translate, embed, chat."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml",
    "keyring",
    "flask",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
