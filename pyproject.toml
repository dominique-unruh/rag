[project]
name = "rag"
version = "0.1.0"
description = "Local single-user RAG pipeline: extract, translate, embed, chat."
readme = "README.md"
requires-python = ">=3.11"
# NOTE: when changing this list, also update the `_DEPS` array in `rag-cli`
# (the convenience launcher keeps its own copy and does not read pyproject).
dependencies = [
    "pyyaml",
    "keyring",
    "flask",
    "argcomplete",
    "markdownify",
    "pypdf",
    "qdrant-client",
    "zstandard",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.hatch.build.targets.wheel.force-include]
"rag/maintenance/index.html" = "rag/maintenance/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
